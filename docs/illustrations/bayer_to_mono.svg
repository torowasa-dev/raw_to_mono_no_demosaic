<rect x="145" y="424" width="60" height="60" rx="5" fill="#21854c"/>
<text x="166.390625" y="440" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" fill="#ffffff">G</text>
