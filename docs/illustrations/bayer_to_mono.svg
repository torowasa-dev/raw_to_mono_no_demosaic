<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">Bayer RAWから補間なしでモノクロ画像を作る</title>
<desc id="desc">重ならない2×2のRGGB画素を平均して1つの階調値へ変換。縦横は半分、画素数は4分の1。黒補正、任意のWB、平均、露出とガンマ、16bit TIFF保存の順。</desc>
<rect width="1600" height="1060" fill="#f2f5f8"/>
<text x="48" y="36" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="44" dominant-baseline="text-before-edge" fill="#162b43">Bayer RAW → 補間なしのモノクロ画像</text>
<text x="48" y="102" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" fill="#50627a">実測した4つの値を平均し、1つの階調値にまとめる</text>
<rect x="40" y="162" width="745" height="480" rx="14" fill="#ffffff"/>
<rect x="805" y="162" width="755" height="480" rx="14" fill="#ffffff"/>
<text x="70" y="188" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" fill="#162b43">01  画素の対応</text>
<text x="70" y="238" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" fill="#162b43">入力：4×4画素（RGGBの例）</text>
