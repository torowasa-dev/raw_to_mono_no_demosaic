<text x="231.390625" y="375" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" fill="#ffffff">G</text>
<rect x="275" y="359" width="60" height="60" rx="5" fill="#326bbc"/>
<text x="296.7890625" y="375" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" fill="#ffffff">B</text>
