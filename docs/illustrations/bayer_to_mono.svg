<rect x="76" y="290" width="128" height="128" fill="none" stroke="#162b43" stroke-width="3"/>
<text x="87" y="295" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="18" dominant-baseline="text-before-edge" fill="#ffffff">A</text>
<rect x="206" y="290" width="128" height="128" fill="none" stroke="#162b43" stroke-width="3"/>
<text x="217" y="295" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="18" dominant-baseline="text-before-edge" fill="#ffffff">B</text>
